<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="/favicon-light.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Blogo — ideas in good company</title>
    <script>
      try {
        const savedTheme = localStorage.getItem("blogo-theme");
        const theme = savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : (window.matchMedia?.("(prefers-color-scheme: dark)")?.matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.getElementById("app-favicon").href = theme === "dark" ? "/favicon-dark.svg" : "/favicon-light.svg";
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#151b22" : "#ffffff";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
